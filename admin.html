<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lagos Bites | Kitchen & Admin Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #E65100;
      --secondary: #2E7D32;
      --dark: #121212;
      --card-bg: #1A1A1A;
      --text-main: #F5F5F5;
      --text-muted: #AAAAAA;
      --border: #2A2A2A;
      --orange: #FF9800;
      --blue: #2196F3;
      --green: #4CAF50;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--dark); color: var(--text-main); padding: 1.5rem; }

    header {
      max-width: 1200px;
      margin: 0 auto 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
    .badge-live { background-color: var(--secondary); color: #fff; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }

    .dashboard-container { max-width: 1200px; margin: 0 auto; }
    .orders-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }

    .order-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      position: relative;
    }

    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .order-id { font-size: 0.8rem; color: var(--text-muted); }
    
    .status-pill {
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status-pending { background-color: #332a00; color: var(--orange); border: 1px solid var(--orange); }
    .status-preparing { background-color: #0d2838; color: var(--blue); border: 1px solid var(--blue); }
    .status-on_the_way { background-color: #38240d; color: #ffab40; border: 1px solid #ffab40; }
    .status-payment_received { background-color: #0e3012; color: var(--green); border: 1px solid var(--green); }
    .status-delivered { background-color: #222; color: var(--text-muted); border: 1px solid #444; }

    .customer-info h3 { font-size: 1.2rem; margin-bottom: 0.2rem; }
    .customer-info p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.3rem; }
    .meal-box { background-color: #111; padding: 0.8rem; border-radius: 6px; margin: 1rem 0; border-left: 3px solid var(--primary); }

    .action-btn {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: all 0.2s ease;
    }
    .btn-prep { background-color: var(--blue); color: #fff; }
    .btn-dispatch { background-color: var(--orange); color: #fff; }
    .btn-payment { background-color: var(--green); color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🌶️ LagosBites <span>Admin</span></div>
    <div class="badge-live">● REAL-TIME DISPATCH ACTIVE</div>
  </header>

  <div class="dashboard-container">
    <h2 style="margin-bottom: 1rem;">Incoming & Active Orders</h2>
    <div class="orders-grid" id="ordersGrid">
      <p style="color: var(--text-muted);">Loading active orders from database...</p>
    </div>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your existing Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBKTNZeRJPEBDmr8zX1UtbFaN_qhx6lZCk",
      authDomain: "lagos-af264.firebaseapp.com",
      projectId: "lagos-af264",
      storageBucket: "lagos-af264.firebasestorage.app",
      messagingSenderId: "606835715980",
      appId: "1:606835715980:web:429f5c884a9d90771ab0a9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ordersGrid = document.getElementById('ordersGrid');

    // Real-time listener: automatically pulls and displays orders when status changes
    onSnapshot(collection(db, "orders"), (snapshot) => {
      ordersGrid.innerHTML = "";

      if (snapshot.empty) {
        ordersGrid.innerHTML = "<p style='color: var(--text-muted);'>No active orders found.</p>";
        return;
      }

      snapshot.forEach((docSnap) => {
        const order = docSnap.data();
        const orderId = docSnap.id;
        const currentStatus = order.status || 'pending';

        const orderCard = document.createElement('div');
        orderCard.className = 'order-card';

        orderCard.innerHTML = `
          <div class="order-header">
            <span class="order-id">ID: ${orderId.substring(0, 8)}...</span>
            <span class="status-pill status-${currentStatus}">${currentStatus.replace('_', ' ')}</span>
          </div>

          <div class="customer-info">
            <h3>${order.fullName || 'Guest Customer'}</h3>
            <p>📞 Phone: <strong>${order.phone || 'N/A'}</strong></p>
            <p>📍 Address: <strong>${order.address || 'N/A'}</strong></p>
          </div>

          <div class="meal-box">
            <p style="font-size: 0.8rem; color: var(--text-muted);">ORDERED ITEM</p>
            <strong style="color: var(--primary);">${order.meal || 'Meal Selected'}</strong>
          </div>

          ${renderAdminButtons(orderId, currentStatus)}
        `;

        ordersGrid.appendChild(orderCard);
      });
    });

    // Generate appropriate control buttons based on current order status
    function renderAdminButtons(orderId, status) {
      if (status === 'pending') {
        return `<button class="action-btn btn-prep" onclick="updateOrderStatus('${orderId}', 'preparing')">Start Preparing Food</button>`;
      } else if (status === 'preparing') {
        return `<button class="action-btn btn-dispatch" onclick="updateOrderStatus('${orderId}', 'on_the_way')">Hand to Dispatch Rider</button>`;
      } else if (status === 'on_the_way') {
        return `<button class="action-btn btn-payment" onclick="updateOrderStatus('${orderId}', 'payment_received')">Confirm Bank Payment Received</button>`;
      } else if (status === 'payment_received') {
        return `<p style="color: var(--green); font-size: 0.9rem; text-align: center; margin-top: 0.5rem;">✔ Payment Confirmed. Waiting for Rider Delivery...</p>`;
      } else {
        return `<p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-top: 0.5rem;">✅ Order Completed & Delivered</p>`;
      }
    }

    // Function to update status in Firestore Database
    window.updateOrderStatus = async function(orderId, newStatus) {
      try {
        const orderRef = doc(db, "orders", orderId);
        await updateDoc(orderRef, { status: newStatus });
      } catch (error) {
        console.error("Error updating order status:", error);
        alert("Failed to update status. Please try again.");
      }
    };
  </script>
</body>
</html>
