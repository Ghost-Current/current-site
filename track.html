<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lagos Bites | Track Your Order</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #E65100;
      --secondary: #2E7D32;
      --dark: #121212;
      --card-bg: #1A1A1A;
      --text-main: #F5F5F5;
      --text-muted: #AAAAAA;
      --border: #2A2A2A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--dark); color: var(--text-main); padding: 1.5rem 1rem; }

    .track-container { max-width: 500px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 2rem; }
    .logo { font-size: 1.8rem; font-weight: 800; color: var(--primary); }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    /* Live Progress Tracker UI */
    .tracker-steps {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      position: relative;
      margin: 1.5rem 0;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      opacity: 0.3;
      transition: all 0.3s ease;
    }

    .step-item.active { opacity: 1; }

    .step-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #222;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
    }

    .step-item.active .step-icon {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .step-item.completed .step-icon {
      background-color: var(--secondary);
      border-color: var(--secondary);
      color: #fff;
    }

    .step-text h4 { font-size: 1rem; }
    .step-text p { font-size: 0.8rem; color: var(--text-muted); }

    /* Bank Payment Details Box */
    .bank-box {
      background-color: #0E2310;
      border: 1px solid var(--secondary);
      border-radius: 8px;
      padding: 1.2rem;
      text-align: center;
      display: none; /* Shown during dispatch/payment stage */
    }

    .bank-box h3 { color: #69F0AE; margin-bottom: 0.5rem; font-size: 1.1rem; }
    .bank-detail { margin: 0.4rem 0; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="track-container">
    <header>
      <div class="logo">🌶️ Lagos<span>Bites</span></div>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Live Delivery Status</p>
    </header>

    <div class="card" id="searchBox">
      <h3 style="margin-bottom: 0.5rem;">Enter Your Order ID</h3>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">Paste the Order ID provided after placing your order.</p>
      <input type="text" id="orderIdInput" placeholder="e.g. 40gHJ0OnKNpkgW0xXy2I" style="width:100%; padding: 0.8rem; background:#111; border:1px solid var(--border); color:#fff; border-radius:6px; margin-bottom:1rem; outline:none;" />
